<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Player</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            font-family: "Segoe UI", Arial, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .player-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .center-play {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            cursor: pointer;
            opacity: 0.9;
        }

        .center-play.hidden {
            display: none;
        }

        .controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 18px 24px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .player-wrapper.show-controls .controls {
            opacity: 1;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn {
            cursor: pointer;
            font-size: 18px;
            opacity: 0.85;
        }

        .btn:hover {
            opacity: 1;
        }

        .video-title {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            opacity: 0.9;
        }

        .progress {
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
        }

        .progress-filled {
            height: 100%;
            width: 0%;
            background: #e50914;
        }

        .volume {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .volume-slider {
            width: 80px;
        }

        .time {
            font-size: 13px;
            opacity: 0.8;
        }

        .lessons-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 320px;
            height: 100%;
            background: rgba(20, 20, 20, 0.97);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            padding: 20px;
            overflow-y: auto;
        }

        .lessons-panel.open {
            transform: translateX(0);
        }

        .lesson {
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 6px;
            color: #ccc;
        }

        .lesson:hover {
            background: #222;
        }

        .lesson.active {
            background: #e50914;
            color: #fff;
            font-weight: 600;
        }

        .volume-indicator {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            width: 140px;
            height: 140px;
            margin: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .volume-indicator.show {
            opacity: 1;
        }

        #seekLeft {
            left: 15%;
            right: auto;
        }

        #seekRight {
            right: 15%;
            left: auto;
        }

        .player-wrapper.hide-cursor {
            cursor: none;
        }

        .next-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 40px;
            pointer-events: none;
            padding-bottom: 110px;
        }

        .next-overlay.show {
            display: flex;
        }

        .next-card {
            position: relative;
            width: 280px;
            background: #141414;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            pointer-events: auto;
        }

        .next-card:hover {
            transform: scale(1.03);
        }

        .next-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            width: 0%;
            background: #e50914;
        }

        .next-text {
            padding: 16px;
        }

        .next-label {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .next-title {
            font-size: 14px;
            font-weight: 600;
        }

        .seek-tooltip {
            position: absolute;
            bottom: 48px;
            padding: 4px 6px;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            transform: translateX(-50%);
            transition: opacity 0.1s;
        }

        .seek-tooltip.show {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="player-wrapper" id="playerWrapper">

        <video id="video" disablePictureInPicture oncontextmenu="return false"></video>

        <div class="center-play" id="centerPlay">▶</div>

        <div class="volume-indicator" id="volumeIndicator">50%</div>
        <div class="volume-indicator" id="seekLeft">◀◀ 5s</div>
        <div class="volume-indicator" id="seekRight">▶▶ 5s</div>

        <div class="controls">
            <div class="progress" id="progress">
                <div class="progress-filled" id="progressFilled"></div>
            </div>

            <div class="seek-tooltip" id="seekTooltip">0:00</div>

            <div class="video-title" id="videoTitle"></div>

            <div class="controls-row">
                <div class="btn" id="playBtn">▶</div>
                <div class="time" id="time">0:00 / 0:00</div>

                <div class="volume">
                    <div class="btn" id="muteBtn">🔊</div>
                    <input type="range" min="0" max="1" step="0.01" class="volume-slider" id="volumeSlider">
                </div>

                <div style="flex:1"></div>
                <div class="btn" id="lessonsBtn">☰</div>
            </div>
        </div>

        <div class="lessons-panel" id="lessonsPanel">
            <div id="lessonList"></div>
        </div>

        <div class="next-overlay" id="nextOverlay">
            <div class="next-card" id="nextBtn">
                <div class="next-progress" id="nextProgress"></div>
                <div class="next-text">
                    <div class="next-label">Up Next</div>
                    <div class="next-title" id="nextTitle"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const video = document.getElementById("video");
        const wrapper = document.getElementById("playerWrapper");
        const centerPlay = document.getElementById("centerPlay");
        const playBtn = document.getElementById("playBtn");
        const timeEl = document.getElementById("time");
        const progress = document.getElementById("progress");
        const progressFilled = document.getElementById("progressFilled");
        const lessonsBtn = document.getElementById("lessonsBtn");
        const lessonsPanel = document.getElementById("lessonsPanel");
        const lessonList = document.getElementById("lessonList");
        const videoTitle = document.getElementById("videoTitle");
        const volumeSlider = document.getElementById("volumeSlider");
        const muteBtn = document.getElementById("muteBtn");
        const volumeIndicator = document.getElementById("volumeIndicator");
        const seekLeft = document.getElementById("seekLeft");
        const seekRight = document.getElementById("seekRight");
        const nextOverlay = document.getElementById("nextOverlay");
        const nextBtn = document.getElementById("nextBtn");
        const nextProgress = document.getElementById("nextProgress");
        const nextTitle = document.getElementById("nextTitle");
        const seekTooltip = document.getElementById("seekTooltip");

        let videos = [];
        let hideTimer;
        let volumeTimer;
        let lastVolume = 0.5;
        let currentFile = new URLSearchParams(location.search).get("file");
        let nextTimer = null;
        let nextShown = false;

        /* LOAD VIDEOS FROM JSON */
        fetch(`videos.json?v=${Date.now()}`)
            .then(r => r.json())
            .then(data => {
                videos = data.videos || [];
                if (!currentFile && videos.length) {
                    currentFile = videos[0].file;
                }
                renderLessons();
                loadVideo(currentFile);
            });



        /* VIDEO */
        function loadVideo(file) {
            if (!file) return;
            currentFile = file;
            video.src = file;
            video.volume = lastVolume;
            volumeSlider.value = lastVolume;
            updateTitle();
            highlightLesson();
            updateMuteIcon();
            video.play().catch(() => {});
        }

        function togglePlay() {
            if (video.paused) video.play();
            else video.pause();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        }


        /* VIDEO EVENTS */
        video.addEventListener("click", () => {
            if (lessonsPanel.classList.contains("open")) return;
            togglePlay();
        });

        video.addEventListener("play", () => {
            centerPlay.classList.add("hidden");
            playBtn.textContent = "⏸";
        });

        video.addEventListener("pause", () => {
            centerPlay.classList.remove("hidden");
            playBtn.textContent = "▶";
        });

        video.addEventListener("timeupdate", () => {
            if (!video.duration) return;

            progressFilled.style.width =
                (video.currentTime / video.duration * 100) + "%";

            timeEl.textContent =
                format(video.currentTime) + " / " + format(video.duration);

            if (video.duration - video.currentTime <= 5) {
                showNextOverlay();
            } else {
                hideNextOverlay();
            }
        });

        video.addEventListener("pause", showControlsTemporarily);
        video.addEventListener("play", showControlsTemporarily);


        /* PROGRESS */
        progress.addEventListener("click", e => {
            if (!video.duration) return;
            video.currentTime = (e.offsetX / progress.offsetWidth) * video.duration;
        });

        /* CONTROLS */
        centerPlay.onclick = togglePlay;
        playBtn.onclick = togglePlay;

        /* VOLUME */
        volumeSlider.oninput = () => setVolume(volumeSlider.value);
        muteBtn.onclick = toggleMute;

        function toggleMute() {
            if (video.muted || video.volume === 0) {
                video.muted = false;
                setVolume(lastVolume || 0.5);
            } else {
                video.muted = true;
                showVolume("🔇");
            }
            updateMuteIcon();
        }

        function setVolume(v) {
            v = Number(v);
            video.muted = v === 0;
            video.volume = v;
            lastVolume = v > 0 ? v : lastVolume;
            volumeSlider.value = v;

            showVolume(Math.round(v * 100) + "%");
            updateMuteIcon();
        }

        function showVolume(text) {
            volumeIndicator.textContent = text;
            volumeIndicator.classList.add("show");
            clearTimeout(volumeTimer);
            volumeTimer = setTimeout(() => {
                volumeIndicator.classList.remove("show");
            }, 600);
        }

        function showSeek(el) {
            // hide ALL overlays immediately
            volumeIndicator.classList.remove("show");
            seekLeft.classList.remove("show");
            seekRight.classList.remove("show");

            // show only the requested one
            el.classList.add("show");

            clearTimeout(volumeTimer);
            volumeTimer = setTimeout(() => {
                el.classList.remove("show");
            }, 600);
        }

        function updateMuteIcon() {
            if (video.muted || video.volume === 0) {
                muteBtn.textContent = "🔇";
            } else {
                muteBtn.textContent = "🔊";
            }
        }

        /* KEYBOARD */
        document.addEventListener("keydown", e => {
            showControlsTemporarily();

            if (e.code === "Space") {
                e.preventDefault();
                togglePlay();
            }
            if (e.code === "ArrowUp") {
                seekLeft.classList.remove("show");
                seekRight.classList.remove("show");
                setVolume(Math.min(video.volume + 0.05, 1));
            }

            if (e.code === "ArrowDown") {
                seekLeft.classList.remove("show");
                seekRight.classList.remove("show");
                setVolume(Math.max(video.volume - 0.05, 0));
            }
            if (e.code === "ArrowRight") {
                video.currentTime = Math.min(video.currentTime + 5, video.duration || video.currentTime);
                showSeek(seekRight);
            }
            if (e.code === "ArrowLeft") {
                video.currentTime = Math.max(video.currentTime - 5, 0);
                showSeek(seekLeft);
            }
            if (e.key.toLowerCase() === "m") toggleMute();
            if (e.key.toLowerCase() === "f") {
                toggleFullscreen();
            }
        });

        /* LESSONS */
        lessonsBtn.onclick = e => {
            e.stopPropagation();
            lessonsPanel.classList.toggle("open");
        };

        lessonsPanel.addEventListener("click", e => e.stopPropagation());

        document.addEventListener("click", () => {
            lessonsPanel.classList.remove("open");
        });

        function renderLessons() {
            lessonList.innerHTML = "";
            videos.forEach(v => {
                const div = document.createElement("div");
                div.className = "lesson";
                div.textContent = v.title;
                div.onclick = e => {
                    e.stopPropagation();
                    loadVideo(v.file);
                    history.replaceState(null, "", `?file=${encodeURIComponent(v.file)}`);
                    lessonsPanel.classList.remove("open");
                };
                lessonList.appendChild(div);
            });
        }

        function highlightLesson() {
            document.querySelectorAll(".lesson").forEach(l => {
                l.classList.toggle(
                    "active",
                    videos.find(v => v.file === currentFile)?.title === l.textContent
                );
            });
        }

        /* UI */
        wrapper.addEventListener("mousemove", showControlsTemporarily);

        function updateTitle() {
            const v = videos.find(x => x.file === currentFile);
            videoTitle.textContent = v ? v.title : "";
        }

        function format(t) {
            if (!t) return "0:00";
            const m = Math.floor(t / 60);
            const s = Math.floor(t % 60).toString().padStart(2, "0");
            return `${m}:${s}`;
        }

        function getNextVideo() {
            const idx = videos.findIndex(v => v.file === currentFile);
            return videos[idx + 1] || null;
        }

        function showNextOverlay() {
            if (nextShown) return;

            const next = getNextVideo();
            if (!next) return;

            nextShown = true;
            nextTitle.textContent = next.title;
            nextOverlay.classList.add("show");

            nextProgress.style.transition = "none";
            nextProgress.style.width = "0%";

            requestAnimationFrame(() => {
                nextProgress.style.transition = "width 5s linear";
                nextProgress.style.width = "100%";
            });

            nextTimer = setTimeout(() => {
                loadVideo(next.file);
                hideNextOverlay();
            }, 5000);
        }

        function hideNextOverlay() {
            nextShown = false;
            clearTimeout(nextTimer);
            nextOverlay.classList.remove("show");
            nextProgress.style.transition = "none";
            nextProgress.style.width = "0%";
        }

        nextBtn.onclick = () => {
            const next = getNextVideo();
            if (!next) return;
            loadVideo(next.file);
            hideNextOverlay();
        };

        function showControlsTemporarily() {
            wrapper.classList.add("show-controls");
            wrapper.classList.remove("hide-cursor");
            clearTimeout(hideTimer);
            if (!video.paused) {
                hideTimer = setTimeout(() => {
                    wrapper.classList.remove("show-controls");
                    wrapper.classList.add("hide-cursor");
                }, 2500);
            }
        }

        progress.addEventListener("mousemove", e => {
            if (!video.duration) return;

            const rect = progress.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            const time = Math.max(0, Math.min(video.duration * percent, video.duration));

            seekTooltip.textContent = format(time);
            seekTooltip.style.left = `${e.clientX - rect.left}px`;
            seekTooltip.classList.add("show");
        });

        progress.addEventListener("mouseleave", () => {
            seekTooltip.classList.remove("show");
        });
    </script>

</body>

</html>
