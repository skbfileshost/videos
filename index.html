<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Videos</title>

<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    padding: 20px;
    background: linear-gradient(135deg, #f5fbff, #eef6fb);
    color: #1f2d3d;
}

h1 {
    text-align: center;
    font-weight: 600;
    letter-spacing: 1px;
    color: #0a3d62;
    margin-bottom: 20px;
}

.search-container {
    max-width: 1100px;
    margin: 0 auto 15px auto;
}

#searchInput {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid #cfe6f5;
    box-shadow: 0 4px 12px rgba(0,120,200,0.06);
}

.content-wrapper {
    display: flex;
    max-width: 1100px;
    margin: 0 auto;
    gap: 20px;
}

/* LIST PANEL */
.list-panel {
    width: 35%;
    position: relative;
    transition: width 0.3s ease;
}

.list-panel.collapsed {
    width: 50px;
}

ul {
    background: #fff;
    border-radius: 10px;
    padding: 25px 35px;
    box-shadow: 0 10px 30px rgba(0,120,200,0.08);
    max-height: calc(100vh - 220px);
    overflow-y: auto;
}

.list-panel.collapsed ul {
    padding: 0;
    overflow: hidden;
}

/* TOGGLE BUTTON */
.toggle-arrow {
    position: absolute;
    top: 20px;
    right: -14px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: #0077c8;
    color: #fff;
    cursor: pointer;
    font-size: 16px;
    box-shadow: 0 4px 10px rgba(0,120,200,0.3);
}

li {
    margin-bottom: 14px;
}

a {
    color: #0077c8;
    text-decoration: none;
    font-weight: 500;
    cursor: pointer;
}

/* PLAYER */
#playerContainer {
    width: 65%;
    position: sticky;
    top: 20px;
    display: none;
    transition: width 0.3s ease;
}

.list-panel.collapsed + #playerContainer {
    width: calc(100% - 50px);
}

video {
    width: 100%;
    border-radius: 10px;
    background: #000;
}

video::-webkit-media-controls-download-button {
    display: none;
}
</style>
</head>

<body>

<h1>Videos</h1>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="Search videos..." />
</div>

<div class="content-wrapper">

    <div class="list-panel" id="listPanel">
        <button class="toggle-arrow" id="toggleBtn">◀</button>
        <ul id="resourceList"></ul>
    </div>

    <div id="playerContainer">
        <video
            id="videoPlayer"
            controls
            controlsList="nodownload noplaybackrate"
            disablePictureInPicture
            oncontextmenu="return false">
        </video>
    </div>

</div>

<script>
const list = document.getElementById("resourceList");
const searchInput = document.getElementById("searchInput");
const videoPlayer = document.getElementById("videoPlayer");
const playerContainer = document.getElementById("playerContainer");
const listPanel = document.getElementById("listPanel");
const toggleBtn = document.getElementById("toggleBtn");

let allVideos = [];
let collapsed = false;

function renderList(items) {
    list.innerHTML = "";
    items.forEach(item => {
        const li = document.createElement("li");
        const link = document.createElement("a");

        link.textContent = item.title;
        link.onclick = () => {
            videoPlayer.src = item.file;
            playerContainer.style.display = "block";
            videoPlayer.play();
        };

        li.appendChild(link);
        list.appendChild(li);
    });
}

toggleBtn.onclick = () => {
    collapsed = !collapsed;
    listPanel.classList.toggle("collapsed", collapsed);
    toggleBtn.textContent = collapsed ? "▶" : "◀";
};

fetch(`videos.json?v=${Date.now()}`)
.then(res => res.json())
.then(data => {
    allVideos = data.videos;
    renderList(allVideos);
});

searchInput.oninput = () => {
    const q = searchInput.value.toLowerCase();
    renderList(allVideos.filter(v => v.title.toLowerCase().includes(q)));
};
</script>

</body>
</html>
