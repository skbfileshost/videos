<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Videos</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #f5fbff, #eef6fb);
            color: #1f2d3d;
        }

        h1 {
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
            color: #0a3d62;
            margin-bottom: 20px;
        }

        .search-container {
            max-width: 1100px;
            margin: 0 auto 15px auto;
        }

        #searchInput {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #cfe6f5;
            outline: none;
            box-shadow: 0 4px 12px rgba(0, 120, 200, 0.06);
        }

        #searchInput:focus {
            border-color: #00a8e8;
        }

        .content-wrapper {
            display: flex;
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
            align-items: flex-start;
        }

        ul {
            flex: 1;
            background: #ffffff;
            border-radius: 10px;
            padding: 25px 35px;
            box-shadow: 0 10px 30px rgba(0, 120, 200, 0.08);
            max-height: calc(100vh - 220px);
            overflow-y: auto;
        }

        li {
            margin-bottom: 14px;
            line-height: 1.6;
        }

        li::marker {
            color: #00a8e8;
        }

        a {
            color: #0077c8;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s ease, border-bottom 0.2s ease;
            border-bottom: 1px solid transparent;
        }

        a:hover {
            color: #00a8e8;
            border-bottom: 1px solid #00a8e8;
        }

        #playerContainer {
            flex: 1;
            position: sticky;
            top: 20px;
            display: none;
        }

        video {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 120, 200, 0.15);
            background: #000;
        }

        video::-webkit-media-controls-download-button {
            display: none;
        }

        video::-webkit-media-controls-enclosure {
            overflow: hidden;
        }
    </style>
</head>

<body>

    <h1>Videos</h1>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search videos..." />
    </div>

    <div class="content-wrapper">

        <ul id="resourceList"></ul>

        <div id="playerContainer">
            <video
                id="videoPlayer"
                controls
                controlsList="nodownload noplaybackrate"
                disablePictureInPicture
                oncontextmenu="return false"
            >
                Your browser does not support the video tag.
            </video>
        </div>

    </div>

    <script>
        const list = document.getElementById("resourceList");
        const searchInput = document.getElementById("searchInput");
        const playerContainer = document.getElementById("playerContainer");
        const videoPlayer = document.getElementById("videoPlayer");

        let allVideos = [];

        function renderList(items) {
            list.innerHTML = "";

            if (items.length === 0) {
                list.innerHTML = "<li>No matching videos found.</li>";
                return;
            }

            items.forEach(item => {
                const li = document.createElement("li");
                const link = document.createElement("a");

                link.textContent = item.title;

                link.addEventListener("click", (e) => {
                    e.preventDefault();

                    videoPlayer.pause();
                    videoPlayer.src = item.file;
                    videoPlayer.load();

                    playerContainer.style.display = "block";
                    videoPlayer.play();
                });

                li.appendChild(link);
                list.appendChild(li);
            });
        }

        fetch(`videos.json?v=${Date.now()}`)
            .then(response => response.json())
            .then(data => {
                allVideos = data.videos;
                renderList(allVideos);
            })
            .catch(() => {
                list.innerHTML = "<li>Failed to load videos.</li>";
            });

        searchInput.addEventListener("input", () => {
            const query = searchInput.value.toLowerCase();
            const filtered = allVideos.filter(item =>
                item.title.toLowerCase().includes(query)
            );
            renderList(filtered);
        });
    </script>

</body>

</html>
