name: Generate videos.json

on:
  push:
    paths:
      - "*.mp4"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build videos.json (ordered by filename number)
        run: |
          set -e

          echo '{ "videos": [' > videos.json
          first=true

          # Optional safety check: fail if a file doesn't start with "number. "
          if git ls-files "*.mp4" | grep -vE '^[0-9]+\. ' ; then
            echo "❌ All .mp4 files must start with 'number. '"
            exit 1
          fi

          git ls-files "*.mp4" \
            | sed -E 's/^([0-9]+)\. (.+)$/\1|\1. \2/' \
            | sort -n -t'|' -k1,1 \
            | while IFS="|" read -r index file; do

              # Title without .mp4 and without the leading number
              title=$(echo "${file%.mp4}" | sed -E 's/^[0-9]+\. //')

              if [ "$first" = false ]; then
                echo ',' >> videos.json
              fi
              first=false

              echo "  { \"title\": \"$title\", \"file\": \"$file\" }" >> videos.json
            done

          echo '] }' >> videos.json

      - name: Commit generated file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add videos.json
          git commit -m "Auto-generate videos.json" || echo "No changes"
          git push
