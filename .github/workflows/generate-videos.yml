name: Generate videos.json

on:
  push:
    paths:
      - "*.mp4"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history required)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build videos.json (preserve upload order)
        run: |
          echo '{ "videos": [' > videos.json
          first=true

          # Get mp4 files in the order they were added (oldest → newest)
          git log --diff-filter=A --name-only --pretty=format: -- "*.mp4" | tac | while read file; do
            [ -f "$file" ] || continue

            title=$(basename "$file" .mp4)

            if [ "$first" = false ]; then
              echo ',' >> videos.json
            fi
            first=false

            echo "  { \"title\": \"$title\", \"file\": \"$file\" }" >> videos.json
          done

          echo '] }' >> videos.json

      - name: Commit generated file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add videos.json
          git commit -m "Auto-generate videos.json" || echo "No changes"
          git push
