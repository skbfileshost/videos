name: Generate videos.json

on:
  push:
    paths:
      - "*.mp4"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build videos.json (true upload order, no duplicates)
        run: |
          echo '{ "videos": [' > videos.json
          first=true

          # Get each mp4 file ONCE, ordered by first commit date
          git ls-files "*.mp4" | while read file; do
            commit_date=$(git log --diff-filter=A --follow --format=%ct -1 -- "$file")
            echo "$commit_date|$file"
          done | sort -n | while IFS="|" read commit_date file; do

            title=$(basename "$file" .mp4)

            if [ "$first" = false ]; then
              echo ',' >> videos.json
            fi
            first=false

            echo "  { \"title\": \"$title\", \"file\": \"$file\" }" >> videos.json
          done

          echo '] }' >> videos.json

      - name: Commit generated file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add videos.json
          git commit -m "Auto-generate videos.json" || echo "No changes"
          git push
