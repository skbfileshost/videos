<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Player</title>

    <style>
        :root {
            --accent: #e50914;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            font-family: "Netflix Sans", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
            overflow: hidden;
            color: #fff;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        .player-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }

        .player-wrapper.hide-cursor { cursor: none; }

        /* ---- top gradient + title ---- */
        .top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 28px 36px;
            display: flex;
            align-items: center;
            gap: 18px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
            pointer-events: none;
            z-index: 6;
        }
        .player-wrapper.show-controls .top-bar { opacity: 1; transform: none; }

        .top-title {
            font-size: 21px;
            font-weight: 600;
            letter-spacing: 0.2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        .top-sub { font-size: 13px; opacity: 0.6; margin-top: 2px; }

        /* ---- center play / buffering ---- */
        .center-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 4;
        }
        .center-play {
            width: 92px; height: 92px;
            border-radius: 50%;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.35s var(--ease), opacity 0.35s var(--ease);
            box-shadow: 0 6px 30px rgba(0,0,0,0.5);
        }
        .center-play svg { width: 42px; height: 42px; margin-left: 4px; fill: #fff; }
        .center-play:hover { transform: scale(1.08); background: rgba(0,0,0,0.6); }
        .center-play.hidden { opacity: 0; transform: scale(0.7); pointer-events: none; }

        /* pulse feedback on play/pause toggle */
        .pulse {
            position: absolute;
            top: 50%; left: 50%;
            width: 96px; height: 96px;
            margin: -48px 0 0 -48px;
            border-radius: 50%;
            background: rgba(0,0,0,0.55);
            display: flex; align-items: center; justify-content: center;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }
        .pulse svg { width: 40px; height: 40px; fill: #fff; }
        .pulse.animate { animation: pulseAnim 0.5s var(--ease) forwards; }
        @keyframes pulseAnim {
            0% { opacity: 0.9; transform: scale(0.8); }
            100% { opacity: 0; transform: scale(1.25); }
        }

        .spinner {
            position: absolute;
            top: 50%; left: 50%;
            width: 62px; height: 62px;
            margin: -31px 0 0 -31px;
            border: 4px solid rgba(255,255,255,0.18);
            border-top-color: var(--accent);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 5;
            pointer-events: none;
        }
        .spinner.show { opacity: 1; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- double-tap seek ripples ---- */
        .seek-ripple {
            position: absolute;
            top: 0; bottom: 0;
            width: 34%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: radial-gradient(closest-side, rgba(255,255,255,0.18), transparent);
            opacity: 0;
            pointer-events: none;
            z-index: 4;
            font-size: 14px;
            font-weight: 600;
        }
        .seek-ripple.left { left: 0; border-radius: 0 50% 50% 0; }
        .seek-ripple.right { right: 0; border-radius: 50% 0 0 50%; }
        .seek-ripple svg { width: 34px; height: 34px; fill: #fff; }
        .seek-ripple.flash { animation: rippleFlash 0.5s var(--ease); }
        @keyframes rippleFlash {
            0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; }
        }

        /* ---- bottom controls ---- */
        .controls {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 0 36px 22px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 10%, rgba(0,0,0,0.35) 55%, transparent);
            display: flex;
            flex-direction: column;
            gap: 6px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
            z-index: 6;
        }
        .player-wrapper.show-controls .controls { opacity: 1; transform: none; }
        .player-wrapper:not(.show-controls) .controls { pointer-events: none; }

        /* progress bar */
        .progress-wrap {
            position: relative;
            padding: 14px 0 10px;
            cursor: pointer;
        }
        .progress {
            position: relative;
            height: 4px;
            border-radius: 4px;
            background: rgba(255,255,255,0.28);
            transition: height 0.15s var(--ease);
        }
        .progress-wrap:hover .progress,
        .progress-wrap.dragging .progress { height: 7px; }

        .progress-buffered {
            position: absolute;
            top: 0; left: 0; height: 100%;
            width: 0%;
            border-radius: 4px;
            background: rgba(255,255,255,0.4);
        }
        .progress-hover {
            position: absolute;
            top: 0; left: 0; height: 100%;
            width: 0%;
            border-radius: 4px;
            background: rgba(255,255,255,0.35);
            opacity: 0;
            transition: opacity 0.15s;
        }
        .progress-wrap:hover .progress-hover { opacity: 1; }
        .progress-filled {
            position: absolute;
            top: 0; left: 0; height: 100%;
            width: 0%;
            border-radius: 4px;
            background: var(--accent);
        }
        .progress-thumb {
            position: absolute;
            top: 50%;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: var(--accent);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.15s var(--ease);
            box-shadow: 0 0 8px rgba(0,0,0,0.6);
        }
        .progress-wrap:hover .progress-thumb,
        .progress-wrap.dragging .progress-thumb { transform: translate(-50%, -50%) scale(1); }

        .seek-tooltip {
            position: absolute;
            bottom: 34px;
            padding: 5px 9px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(20,20,20,0.95);
            border-radius: 5px;
            pointer-events: none;
            opacity: 0;
            transform: translateX(-50%);
            transition: opacity 0.12s;
            white-space: nowrap;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
        }
        .seek-tooltip.show { opacity: 1; }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 22px;
        }
        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 22px;
        }
        .controls-right { margin-left: auto; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            background: none;
            color: #fff;
            padding: 0;
            opacity: 0.92;
            transition: transform 0.15s var(--ease), opacity 0.15s;
        }
        .btn svg { width: 27px; height: 27px; fill: #fff; }
        .btn:hover { transform: scale(1.14); opacity: 1; }
        .btn:active { transform: scale(0.95); }

        .time {
            font-size: 14px;
            font-variant-numeric: tabular-nums;
            opacity: 0.9;
            letter-spacing: 0.3px;
        }
        .time .dur { opacity: 0.6; }

        /* volume */
        .volume {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .volume-slider {
            width: 0;
            opacity: 0;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.35);
            border-radius: 4px;
            cursor: pointer;
            transition: width 0.28s var(--ease), opacity 0.28s var(--ease);
        }
        .volume:hover .volume-slider,
        .volume.active .volume-slider { width: 90px; opacity: 1; }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px; height: 13px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
        .volume-slider::-moz-range-thumb {
            width: 13px; height: 13px; border: none;
            border-radius: 50%; background: #fff; cursor: pointer;
        }

        /* settings popover */
        .popover {
            position: absolute;
            bottom: 66px; right: 36px;
            width: 240px;
            background: rgba(20,20,20,0.97);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 8px;
            opacity: 0;
            transform: translateY(8px) scale(0.98);
            transform-origin: bottom right;
            pointer-events: none;
            transition: opacity 0.22s var(--ease), transform 0.22s var(--ease);
            z-index: 8;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        .popover.open { opacity: 1; transform: none; pointer-events: auto; }
        .popover-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            opacity: 0.5;
            padding: 8px 10px 4px;
        }
        .speed-opt {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 10px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.12s;
        }
        .speed-opt:hover { background: rgba(255,255,255,0.08); }
        .speed-opt.active { color: var(--accent); font-weight: 600; }
        .speed-opt .check { width: 16px; height: 16px; opacity: 0; }
        .speed-opt.active .check { opacity: 1; }
        .speed-opt .check svg { width: 16px; height: 16px; fill: var(--accent); }

        /* ---- episodes panel ---- */
        .panel-scrim {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s var(--ease);
            z-index: 9;
        }
        .panel-scrim.open { opacity: 1; pointer-events: auto; }

        .lessons-panel {
            position: absolute;
            top: 0; right: 0;
            width: 380px;
            max-width: 88vw;
            height: 100%;
            background: rgba(16,16,16,0.98);
            transform: translateX(100%);
            transition: transform 0.4s var(--ease);
            padding: 26px 20px;
            overflow-y: auto;
            z-index: 10;
            box-shadow: -20px 0 60px rgba(0,0,0,0.6);
        }
        .lessons-panel.open { transform: none; }
        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 6px 18px;
        }
        .panel-head h3 { margin: 0; font-size: 18px; font-weight: 600; }
        .panel-close { cursor: pointer; opacity: 0.7; }
        .panel-close:hover { opacity: 1; }
        .panel-close svg { width: 22px; height: 22px; fill: #fff; }

        .lesson {
            display: flex;
            gap: 14px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: background 0.15s;
        }
        .lesson:hover { background: rgba(255,255,255,0.06); }
        .lesson.active { background: rgba(255,255,255,0.10); }
        .lesson-num {
            font-size: 18px;
            font-weight: 600;
            opacity: 0.5;
            min-width: 22px;
            text-align: center;
            align-self: center;
        }
        .lesson.active .lesson-num { color: var(--accent); opacity: 1; }
        .lesson-thumb {
            width: 112px; height: 63px;
            border-radius: 6px;
            background: linear-gradient(135deg, #2a2a2a, #161616);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .lesson-thumb svg { width: 26px; height: 26px; fill: rgba(255,255,255,0.5); }
        .lesson.active .lesson-thumb { outline: 2px solid var(--accent); }
        .lesson-meta { align-self: center; }
        .lesson-title { font-size: 14px; font-weight: 500; line-height: 1.35; }
        .lesson.active .lesson-title { font-weight: 600; }
        .now-playing {
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-top: 4px;
            display: none;
        }
        .lesson.active .now-playing { display: block; }

        /* ---- up next ---- */
        .next-overlay {
            position: absolute;
            right: 36px;
            bottom: 96px;
            z-index: 7;
            opacity: 0;
            transform: translateY(14px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
        }
        .next-overlay.show { opacity: 1; transform: none; pointer-events: auto; }
        .next-card {
            position: relative;
            width: 300px;
            background: rgba(20,20,20,0.97);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 14px 44px rgba(0,0,0,0.6);
            transition: transform 0.2s var(--ease);
        }
        .next-card:hover { transform: scale(1.03); }
        .next-thumb {
            height: 150px;
            background: linear-gradient(135deg, #2a2a2a, #141414);
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .next-thumb svg { width: 40px; height: 40px; fill: rgba(255,255,255,0.55); }
        .next-progress {
            position: absolute;
            bottom: 0; left: 0;
            height: 4px; width: 0%;
            background: var(--accent);
        }
        .next-text { padding: 14px 16px 16px; }
        .next-label { font-size: 12px; opacity: 0.65; margin-bottom: 5px; letter-spacing: 0.4px; }
        .next-title { font-size: 15px; font-weight: 600; }
        .next-cancel {
            margin-top: 10px;
            font-size: 12px;
            opacity: 0.6;
            display: inline-block;
        }
        .next-cancel:hover { opacity: 1; text-decoration: underline; }

        /* toast for keyboard actions */
        .toast {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.6);
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.2s;
            backdrop-filter: blur(4px);
        }
        .toast.show { opacity: 1; }

        input:focus, button:focus { outline: none; }
    </style>
</head>

<body>

    <div class="player-wrapper" id="playerWrapper">

        <video id="video" playsinline disablePictureInPicture oncontextmenu="return false"></video>

        <div class="spinner" id="spinner"></div>

        <div class="seek-ripple left" id="seekLeft">
            <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
            <span>10s</span>
        </div>
        <div class="seek-ripple right" id="seekRight">
            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            <span>10s</span>
        </div>

        <div class="pulse" id="pulse"></div>

        <div class="center-icon">
            <div class="center-play" id="centerPlay">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
        </div>

        <div class="toast" id="toast"></div>

        <div class="top-bar">
            <div>
                <div class="top-title" id="topTitle"></div>
                <div class="top-sub" id="topSub"></div>
            </div>
        </div>

        <div class="controls" id="controls">

            <div class="progress-wrap" id="progressWrap">
                <div class="seek-tooltip" id="seekTooltip">0:00</div>
                <div class="progress" id="progress">
                    <div class="progress-buffered" id="progressBuffered"></div>
                    <div class="progress-hover" id="progressHover"></div>
                    <div class="progress-filled" id="progressFilled"></div>
                    <div class="progress-thumb" id="progressThumb"></div>
                </div>
            </div>

            <div class="controls-row">
                <div class="controls-left">
                    <button class="btn" id="playBtn" title="Play/Pause (Space)">
                        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button class="btn" id="backBtn" title="Back 10s (J / ←)">
                        <svg viewBox="0 0 24 24"><path d="M12.5 8V4l-5 5 5 5V10c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4.5c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                    </button>
                    <button class="btn" id="fwdBtn" title="Forward 10s (L / →)">
                        <svg viewBox="0 0 24 24"><path d="M11.5 8V4l5 5-5 5v-4c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
                    </button>
                    <div class="volume" id="volume">
                        <button class="btn" id="muteBtn" title="Mute (M)">
                            <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.05A4.5 4.5 0 0016.5 12zM14 3.23v2.06a7 7 0 010 13.42v2.06a9 9 0 000-17.54z"/></svg>
                        </button>
                        <input type="range" min="0" max="1" step="0.01" class="volume-slider" id="volumeSlider">
                    </div>
                    <div class="time" id="time">0:00<span class="dur"> / 0:00</span></div>
                </div>

                <div class="controls-right">
                    <button class="btn" id="settingsBtn" title="Playback speed">
                        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84a.48.48 0 00-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87a.49.49 0 00.12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 00-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>
                    </button>
                    <button class="btn" id="pipBtn" title="Picture in picture">
                        <svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16.01H3V4.98h18v14.03z"/></svg>
                    </button>
                    <button class="btn" id="lessonsBtn" title="Episodes">
                        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
                    </button>
                    <button class="btn" id="fsBtn" title="Fullscreen (F)">
                        <svg id="fsIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="popover" id="settingsPopover">
            <div class="popover-label">Playback speed</div>
            <div id="speedList"></div>
        </div>

        <div class="panel-scrim" id="panelScrim"></div>
        <div class="lessons-panel" id="lessonsPanel">
            <div class="panel-head">
                <h3>Episodes</h3>
                <div class="panel-close" id="panelClose">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </div>
            </div>
            <div id="lessonList"></div>
        </div>

        <div class="next-overlay" id="nextOverlay">
            <div class="next-card" id="nextBtn">
                <div class="next-thumb">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <div class="next-progress" id="nextProgress"></div>
                </div>
                <div class="next-text">
                    <div class="next-label">Up Next</div>
                    <div class="next-title" id="nextTitle"></div>
                    <div class="next-cancel" id="nextCancel">Cancel</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const $ = id => document.getElementById(id);
        const video = $("video");
        const wrapper = $("playerWrapper");
        const centerPlay = $("centerPlay");
        const playBtn = $("playBtn"), playIcon = $("playIcon");
        const backBtn = $("backBtn"), fwdBtn = $("fwdBtn");
        const timeEl = $("time");
        const progressWrap = $("progressWrap");
        const progress = $("progress");
        const progressFilled = $("progressFilled");
        const progressBuffered = $("progressBuffered");
        const progressHover = $("progressHover");
        const progressThumb = $("progressThumb");
        const lessonsBtn = $("lessonsBtn");
        const lessonsPanel = $("lessonsPanel");
        const panelScrim = $("panelScrim");
        const panelClose = $("panelClose");
        const lessonList = $("lessonList");
        const topTitle = $("topTitle"), topSub = $("topSub");
        const volume = $("volume");
        const volumeSlider = $("volumeSlider");
        const muteBtn = $("muteBtn"), volIcon = $("volIcon");
        const seekLeft = $("seekLeft"), seekRight = $("seekRight");
        const nextOverlay = $("nextOverlay");
        const nextBtn = $("nextBtn"), nextCancel = $("nextCancel");
        const nextProgress = $("nextProgress"), nextTitle = $("nextTitle");
        const seekTooltip = $("seekTooltip");
        const spinner = $("spinner");
        const pulse = $("pulse");
        const toast = $("toast");
        const fsBtn = $("fsBtn"), fsIcon = $("fsIcon");
        const pipBtn = $("pipBtn");
        const settingsBtn = $("settingsBtn");
        const settingsPopover = $("settingsPopover");
        const speedList = $("speedList");

        const ICONS = {
            play: "M8 5v14l11-7z",
            pause: "M6 5h4v14H6zM14 5h4v14h-4z",
            volHigh: "M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.05A4.5 4.5 0 0016.5 12zM14 3.23v2.06a7 7 0 010 13.42v2.06a9 9 0 000-17.54z",
            volLow: "M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.05A4.5 4.5 0 0016.5 12z",
            volMute: "M16.5 12A4.5 4.5 0 0014 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.9 8.9 0 0021 12a9 9 0 00-7-8.77v2.06A7 7 0 0119 12zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 003.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z",
            expand: "M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z",
            compress: "M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"
        };

        let videos = [];
        let hideTimer, volumeTimer, seekTimer;
        let lastVolume = 0.5;
        let currentFile = new URLSearchParams(location.search).get("file");
        let nextTimer = null, nextShown = false, nextCancelled = false;
        let scrubbing = false;

        /* ---------- LOAD ---------- */
        fetch(`videos.json?v=${Date.now()}`)
            .then(r => r.json())
            .then(data => {
                videos = data.videos || [];
                if (!currentFile && videos.length) currentFile = videos[0].file;
                renderLessons();
                renderSpeeds();
                loadVideo(currentFile);
            })
            .catch(() => { topTitle.textContent = "Could not load videos.json"; });

        function loadVideo(file) {
            if (!file) return;
            currentFile = file;
            nextCancelled = false;
            video.src = file;
            video.volume = lastVolume;
            volumeSlider.value = lastVolume;
            updateTitle();
            highlightLesson();
            updateVolIcon();
            hideNextOverlay();
            video.play().catch(() => {});
        }

        /* ---------- PLAY / PAUSE ---------- */
        function togglePlay() {
            if (video.paused) video.play(); else video.pause();
        }
        function flashPulse(iconPath) {
            pulse.innerHTML = `<svg viewBox="0 0 24 24"><path d="${iconPath}"/></svg>`;
            pulse.classList.remove("animate");
            void pulse.offsetWidth;
            pulse.classList.add("animate");
        }

        video.addEventListener("click", () => {
            if (lessonsPanel.classList.contains("open") || settingsPopover.classList.contains("open")) return;
            togglePlay();
        });
        video.addEventListener("dblclick", toggleFullscreen);

        centerPlay.onclick = togglePlay;
        playBtn.onclick = togglePlay;

        video.addEventListener("play", () => {
            centerPlay.classList.add("hidden");
            playIcon.setAttribute("d", ICONS.pause);
            playBtn.querySelector("path").setAttribute("d", ICONS.pause);
            flashPulse(ICONS.play);
            showControlsTemporarily();
        });
        video.addEventListener("pause", () => {
            centerPlay.classList.remove("hidden");
            playIcon.setAttribute("d", ICONS.play);
            playBtn.querySelector("path").setAttribute("d", ICONS.play);
            flashPulse(ICONS.pause);
            showControlsTemporarily();
        });

        /* buffering spinner */
        video.addEventListener("waiting", () => spinner.classList.add("show"));
        video.addEventListener("playing", () => spinner.classList.remove("show"));
        video.addEventListener("canplay", () => spinner.classList.remove("show"));

        /* ---------- TIME / PROGRESS ---------- */
        video.addEventListener("timeupdate", () => {
            if (!video.duration) return;
            if (!scrubbing) {
                const pct = video.currentTime / video.duration * 100;
                progressFilled.style.width = pct + "%";
                progressThumb.style.left = pct + "%";
            }
            timeEl.innerHTML = format(video.currentTime) +
                `<span class="dur"> / ${format(video.duration)}</span>`;

            if (video.duration - video.currentTime <= 8 && video.currentTime > 0) showNextOverlay();
            else hideNextOverlay();
        });

        video.addEventListener("progress", updateBuffered);
        video.addEventListener("timeupdate", updateBuffered);
        function updateBuffered() {
            if (!video.duration || !video.buffered.length) return;
            const end = video.buffered.end(video.buffered.length - 1);
            progressBuffered.style.width = (end / video.duration * 100) + "%";
        }

        video.addEventListener("ended", () => {
            const next = getNextVideo();
            if (next && !nextCancelled) loadVideo(next.file);
        });

        function seekFromEvent(e) {
            const rect = progress.getBoundingClientRect();
            let pct = (e.clientX - rect.left) / rect.width;
            pct = Math.max(0, Math.min(1, pct));
            return pct;
        }

        progressWrap.addEventListener("mousedown", e => {
            if (!video.duration) return;
            scrubbing = true;
            progressWrap.classList.add("dragging");
            const pct = seekFromEvent(e);
            progressFilled.style.width = pct * 100 + "%";
            progressThumb.style.left = pct * 100 + "%";
        });
        document.addEventListener("mousemove", e => {
            if (!scrubbing || !video.duration) return;
            const pct = seekFromEvent(e);
            progressFilled.style.width = pct * 100 + "%";
            progressThumb.style.left = pct * 100 + "%";
            showTooltip(e, pct);
        });
        document.addEventListener("mouseup", e => {
            if (!scrubbing) return;
            scrubbing = false;
            progressWrap.classList.remove("dragging");
            if (video.duration) video.currentTime = seekFromEvent(e) * video.duration;
        });

        progressWrap.addEventListener("mousemove", e => {
            if (!video.duration) return;
            const pct = seekFromEvent(e);
            progressHover.style.width = pct * 100 + "%";
            showTooltip(e, pct);
        });
        progressWrap.addEventListener("mouseleave", () => {
            if (!scrubbing) seekTooltip.classList.remove("show");
        });
        function showTooltip(e, pct) {
            const rect = progress.getBoundingClientRect();
            seekTooltip.textContent = format(pct * video.duration);
            seekTooltip.style.left = Math.max(0, Math.min(rect.width, e.clientX - rect.left)) + "px";
            seekTooltip.classList.add("show");
        }

        /* ---------- SKIP ---------- */
        function skip(sec) {
            if (!video.duration) return;
            video.currentTime = Math.max(0, Math.min(video.currentTime + sec, video.duration));
            flashRipple(sec > 0 ? seekRight : seekLeft);
        }
        function flashRipple(el) {
            el.classList.remove("flash");
            void el.offsetWidth;
            el.classList.add("flash");
        }
        backBtn.onclick = () => skip(-10);
        fwdBtn.onclick = () => skip(10);

        /* ---------- VOLUME ---------- */
        volumeSlider.oninput = () => setVolume(volumeSlider.value);
        muteBtn.onclick = toggleMute;
        function toggleMute() {
            if (video.muted || video.volume === 0) { video.muted = false; setVolume(lastVolume || 0.5); }
            else { video.muted = true; }
            updateVolIcon();
        }
        function setVolume(v) {
            v = Number(v);
            video.muted = v === 0;
            video.volume = v;
            if (v > 0) lastVolume = v;
            volumeSlider.value = v;
            updateVolIcon();
        }
        function updateVolIcon() {
            const v = video.volume;
            if (video.muted || v === 0) volIcon.setAttribute("d", ICONS.volMute);
            else if (v < 0.5) volIcon.setAttribute("d", ICONS.volLow);
            else volIcon.setAttribute("d", ICONS.volHigh);
        }

        /* ---------- FULLSCREEN ---------- */
        function toggleFullscreen() {
            if (!document.fullscreenElement) wrapper.requestFullscreen().catch(() => {});
            else document.exitFullscreen();
        }
        fsBtn.onclick = toggleFullscreen;
        document.addEventListener("fullscreenchange", () => {
            fsIcon.setAttribute("d", document.fullscreenElement ? ICONS.compress : ICONS.expand);
        });

        /* ---------- PIP ---------- */
        pipBtn.onclick = async () => {
            try {
                if (document.pictureInPictureElement) await document.exitPictureInPicture();
                else await video.requestPictureInPicture();
            } catch (_) {}
        };

        /* ---------- SETTINGS / SPEED ---------- */
        const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
        let currentSpeed = 1;
        function renderSpeeds() {
            speedList.innerHTML = "";
            SPEEDS.forEach(s => {
                const d = document.createElement("div");
                d.className = "speed-opt" + (s === currentSpeed ? " active" : "");
                d.innerHTML = `<span>${s === 1 ? "Normal" : s + "x"}</span>
                    <span class="check"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>`;
                d.onclick = e => { e.stopPropagation(); setSpeed(s); };
                speedList.appendChild(d);
            });
        }
        function setSpeed(s) {
            currentSpeed = s;
            video.playbackRate = s;
            renderSpeeds();
            showToast(s === 1 ? "Normal speed" : s + "x speed");
        }
        settingsBtn.onclick = e => {
            e.stopPropagation();
            settingsPopover.classList.toggle("open");
        };
        settingsPopover.addEventListener("click", e => e.stopPropagation());

        /* ---------- EPISODES ---------- */
        function openPanel() { lessonsPanel.classList.add("open"); panelScrim.classList.add("open"); }
        function closePanel() { lessonsPanel.classList.remove("open"); panelScrim.classList.remove("open"); }
        lessonsBtn.onclick = e => { e.stopPropagation(); openPanel(); };
        panelClose.onclick = e => { e.stopPropagation(); closePanel(); };
        panelScrim.onclick = closePanel;
        lessonsPanel.addEventListener("click", e => e.stopPropagation());
        document.addEventListener("click", () => {
            settingsPopover.classList.remove("open");
        });

        function renderLessons() {
            lessonList.innerHTML = "";
            videos.forEach((v, i) => {
                const div = document.createElement("div");
                div.className = "lesson";
                div.dataset.file = v.file;
                div.innerHTML = `
                    <div class="lesson-num">${i + 1}</div>
                    <div class="lesson-thumb"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                    <div class="lesson-meta">
                        <div class="lesson-title">${escapeHtml(v.title)}</div>
                        <div class="now-playing">Now Playing</div>
                    </div>`;
                div.onclick = e => {
                    e.stopPropagation();
                    loadVideo(v.file);
                    history.replaceState(null, "", `?file=${encodeURIComponent(v.file)}`);
                    closePanel();
                };
                lessonList.appendChild(div);
            });
            highlightLesson();
        }
        function highlightLesson() {
            document.querySelectorAll(".lesson").forEach(l => {
                l.classList.toggle("active", l.dataset.file === currentFile);
            });
        }
        function escapeHtml(s) {
            return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        }

        /* ---------- TITLE ---------- */
        function updateTitle() {
            const idx = videos.findIndex(x => x.file === currentFile);
            const v = videos[idx];
            topTitle.textContent = v ? v.title : "";
            topSub.textContent = v ? `Episode ${idx + 1} of ${videos.length}` : "";
        }

        /* ---------- UP NEXT ---------- */
        function getNextVideo() {
            const idx = videos.findIndex(v => v.file === currentFile);
            return videos[idx + 1] || null;
        }
        function showNextOverlay() {
            if (nextShown || nextCancelled) return;
            const next = getNextVideo();
            if (!next) return;
            nextShown = true;
            nextTitle.textContent = next.title;
            nextOverlay.classList.add("show");
            nextProgress.style.transition = "none";
            nextProgress.style.width = "0%";
            requestAnimationFrame(() => {
                const remain = Math.max(0.3, video.duration - video.currentTime);
                nextProgress.style.transition = `width ${remain}s linear`;
                nextProgress.style.width = "100%";
            });
        }
        function hideNextOverlay() {
            nextShown = false;
            clearTimeout(nextTimer);
            nextOverlay.classList.remove("show");
            nextProgress.style.transition = "none";
            nextProgress.style.width = "0%";
        }
        nextBtn.onclick = e => {
            if (e.target === nextCancel) return;
            const next = getNextVideo();
            if (next) loadVideo(next.file);
        };
        nextCancel.onclick = e => {
            e.stopPropagation();
            nextCancelled = true;
            hideNextOverlay();
        };

        /* ---------- CONTROLS VISIBILITY ---------- */
        wrapper.addEventListener("mousemove", showControlsTemporarily);
        wrapper.addEventListener("mouseleave", () => {
            if (!video.paused) hideControls();
        });
        function showControlsTemporarily() {
            wrapper.classList.add("show-controls");
            wrapper.classList.remove("hide-cursor");
            clearTimeout(hideTimer);
            if (!video.paused && !lessonsPanel.classList.contains("open") && !settingsPopover.classList.contains("open")) {
                hideTimer = setTimeout(hideControls, 2800);
            }
        }
        function hideControls() {
            if (lessonsPanel.classList.contains("open") || settingsPopover.classList.contains("open")) return;
            wrapper.classList.remove("show-controls");
            wrapper.classList.add("hide-cursor");
            seekTooltip.classList.remove("show");
        }

        /* ---------- TOAST ---------- */
        function showToast(text) {
            toast.textContent = text;
            toast.classList.add("show");
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.remove("show"), 800);
        }

        /* ---------- KEYBOARD ---------- */
        document.addEventListener("keydown", e => {
            if (e.target.tagName === "INPUT") return;
            const k = e.key.toLowerCase();
            if (e.code === "Space" || k === "k") { e.preventDefault(); togglePlay(); return; }
            showControlsTemporarily();
            switch (e.code) {
                case "ArrowRight": skip(5); break;
                case "ArrowLeft": skip(-5); break;
                case "ArrowUp": e.preventDefault(); setVolume(Math.min(video.volume + 0.05, 1)); showToast("Volume " + Math.round(video.volume * 100) + "%"); break;
                case "ArrowDown": e.preventDefault(); setVolume(Math.max(video.volume - 0.05, 0)); showToast("Volume " + Math.round(video.volume * 100) + "%"); break;
            }
            if (k === "j") skip(-10);
            if (k === "l") skip(10);
            if (k === "m") toggleMute();
            if (k === "f") toggleFullscreen();
            if (k === "c") closePanel();
            if (k === ">") { const i = SPEEDS.indexOf(currentSpeed); if (i < SPEEDS.length - 1) setSpeed(SPEEDS[i + 1]); }
            if (k === "<") { const i = SPEEDS.indexOf(currentSpeed); if (i > 0) setSpeed(SPEEDS[i - 1]); }
            if (/^[0-9]$/.test(k) && video.duration) {
                video.currentTime = video.duration * (Number(k) / 10);
            }
        });

        /* ---------- HELPERS ---------- */
        function format(t) {
            if (!t || isNaN(t)) return "0:00";
            const h = Math.floor(t / 3600);
            const m = Math.floor((t % 3600) / 60);
            const s = Math.floor(t % 60).toString().padStart(2, "0");
            if (h > 0) return `${h}:${m.toString().padStart(2, "0")}:${s}`;
            return `${m}:${s}`;
        }
    </script>

</body>
